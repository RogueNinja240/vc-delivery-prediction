version: '3.8'

services:
  backend:
    build: .
    container_name: delivery_backend
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  frontend:
    build: .
    container_name: delivery_frontend
    command: streamlit run frontend.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      # In Docker network, 'backend' resolves to the backend container's IP
      - API_URL=http://backend:8000